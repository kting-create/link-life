server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/linklife?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:linklife}
    password: ${DB_PASSWORD:linklife}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}

link:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-must-be-at-least-32-bytes!}
    access-ttl-hours: 168
    refresh-ttl-days: 30
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    api-base: ${WX_API_BASE:https://api.weixin.qq.com}
  notify:
    feishu:
      enabled: ${FEISHU_NOTIFY_ENABLED:false}
      webhook-url: ${FEISHU_WEBHOOK_URL:}
    wx-subscribe:
      enabled: ${WX_SUBSCRIBE_ENABLED:false}
      template-id: ${WX_SUBSCRIBE_TEMPLATE_ID:}
      page: pages/sheet-detail/sheet-detail

logging:
  file:
    name: logs/link-life.log
