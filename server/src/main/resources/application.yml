server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/linklife?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:linklife}
    password: ${DB_PASSWORD:linklife}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    chat:
      client:
        enabled: false
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${DASHSCOPE_VL_MODEL:qwen3-vl-flash}

link:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-must-be-at-least-32-bytes!}
    access-ttl-hours: 168
    refresh-ttl-days: 30
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    api-base: ${WX_API_BASE:https://api.weixin.qq.com}
  notify:
    feishu:
      enabled: ${FEISHU_NOTIFY_ENABLED:false}
      webhook-url: ${FEISHU_WEBHOOK_URL:}
    wx-subscribe:
      enabled: ${WX_SUBSCRIBE_ENABLED:false}
      template-id: ${WX_SUBSCRIBE_TEMPLATE_ID:}
      page: pages/sheet-detail/sheet-detail
  images:
    base-dir: ${IMAGE_BASE_DIR:/data}

logging:
  file:
    name: logs/link-life.log
