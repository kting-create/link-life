services:
  app:
    build: ../server
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/linklife?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: linklife
      DB_PASSWORD: ${DB_PASSWORD:-linklife-prod}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-placeholder-configure-real-key}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      FEISHU_NOTIFY_ENABLED: ${FEISHU_NOTIFY_ENABLED:-false}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      WX_SUBSCRIBE_ENABLED: ${WX_SUBSCRIBE_ENABLED:-false}
      WX_SUBSCRIBE_TEMPLATE_ID: ${WX_SUBSCRIBE_TEMPLATE_ID:-}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: linklife
      MYSQL_USER: linklife
      MYSQL_PASSWORD: ${DB_PASSWORD:-linklife-prod}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-prod}
    command: --innodb-buffer-pool-size=128M --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulinklife", "-p${DB_PASSWORD:-linklife-prod}"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web-dist:/usr/share/nginx/html:ro
      - ../data/images:/data/images:ro
    depends_on:
      - app

volumes:
  mysql-data:
